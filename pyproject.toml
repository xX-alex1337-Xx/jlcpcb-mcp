[project]
name = "jlcpcb-mcp"
version = "0.1.0"
description = "MCP Server for JLCPCB & LCSC SMT component live search, parametric filtering, stock and basic/extended classification"
readme = "README.md"
authors = [
    { name = "Alexander Ratzinger", email = "alexanderratzinger@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
jlcpcb-mcp = "jlcpcb_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jlcpcb_mcp"]
